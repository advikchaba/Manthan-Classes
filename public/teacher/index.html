<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard - Manthan Classes</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('mc-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div id="loginGate" class="gate">
<div class="gate-card">
<span class="brand-mark" aria-hidden="true">M</span>
<h1>Admin login</h1>
<p class="gate-sub">Enter the security code to open the teacher dashboard.</p>
<input type="password" id="gateCode" class="field-input" placeholder="Security code" autocomplete="current-password" autofocus>
<div id="gateError" class="error"></div>
<button class="btn-primary gate-btn" onclick="checkCode()">Enter dashboard</button>
</div>
</div>

<div id="appShell" style="display:none;">
<nav class="navbar">
<div class="nav-left">
<span class="brand-mark" aria-hidden="true">M</span>
<span class="nav-brand">Manthan Classes</span>
</div>
<div class="nav-actions">
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
<svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
</button>
<button class="nav-btn-icon" onclick="window.location.href='../index.html'">Student portal</button>
</div>
</nav>

<div class="app-shell">
<aside class="sidebar">
<div class="sidebar-header">
<span class="sidebar-eyebrow">Teacher portal</span>
</div>
<nav class="sidebar-nav">
<button class="sidebar-item active" data-section="dashboard">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.4 12 3.5l8.5 6.9"/><path d="M5.8 9.6V20h12.4V9.6"/><path d="M10 20v-5.2h4V20"/></svg>
<span class="item-label">Dashboard</span>
</button>
<button class="sidebar-item" data-section="classes">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="12.5" height="13" rx="2.5"/><path d="m15.5 10.5 5.5-3v9l-5.5-3"/></svg>
<span class="item-label">Create Classes</span>
</button>
<button class="sidebar-item" data-section="courses">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/><path d="M8 7.5h8"/></svg>
<span class="item-label">Create Courses</span>
</button>
<button class="sidebar-item" data-section="material">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5L13.5 3Z"/><path d="M13.5 3v5.5H19"/><path d="M8.5 13.5h7M8.5 17h4.5"/></svg>
<span class="item-label">Upload Material</span>
</button>
<button class="sidebar-item" data-section="tests">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6v2.2H9z"/><path d="M9 5.6H7.2a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2H15"/><path d="m8.8 13.6 2 2 4.4-4.4"/></svg>
<span class="item-label">Make Tests</span>
</button>
<button class="sidebar-item" data-section="manage">
<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5.2A1.2 1.2 0 0 1 10.2 4h3.6A1.2 1.2 0 0 1 15 5.2V7"/><path d="M6.5 7 7.4 19a2 2 0 0 0 2 1.9h5.2a2 2 0 0 0 2-1.9L17.5 7"/></svg>
<span class="item-label">Manage Content</span>
</button>
</nav>
</aside>

<main class="content" id="app"></main>
</div>
</div>

<template id="tpl-dashboard">
<div class="page teacher-page">
<header class="page-head">
<h1>Teacher dashboard</h1>
<p class="page-sub">Publish classes, courses, notes and tests for your students.</p>
</header>
<div class="main-grid">
<div class="main-card" onclick="render('classes')">
<h3 class="card-title">Create Classes</h3>
<p class="card-sub">Set up live classes with Google Meet links</p>
</div>
<div class="main-card" onclick="render('courses')">
<h3 class="card-title">Create Courses</h3>
<p class="card-sub">Upload videos and PDFs for paid courses</p>
</div>
<div class="main-card" onclick="render('material')">
<h3 class="card-title">Upload Material</h3>
<p class="card-sub">PDFs that students can view on the site</p>
</div>
<div class="main-card" onclick="render('tests')">
<h3 class="card-title">Make Tests</h3>
<p class="card-sub">Create MCQ tests for students</p>
</div>
</div>
</div>
</template>

<template id="tpl-classes">
<div class="page teacher-page">
<header class="page-header">
<button class="btn-back" onclick="render('dashboard')">Back</button>
<h1>Create Classes</h1>
<p class="section-desc">Set up live classes with a name, grade, subject, and Google Meet link</p>
</header>
<form id="makeClassForm" class="form-card">
<label class="field-label">Class Name</label>
<input type="text" class="field-input" placeholder="e.g. Physics - Class 11" required>
<label class="field-label">Grade</label>
<select class="field-select" required>
<option value="">Select Grade</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>
<label class="field-label">Subject</label>
<select class="field-select" required>
<option value="">Select Subject</option>
<option value="physics">Physics</option>
<option value="maths">Mathematics</option>
<option value="chemistry">Chemistry</option>
<option value="biology">Biology</option>
</select>
<label class="field-label">Google Meet Link</label>
<input type="text" class="field-input" placeholder="https://meet.google.com/..." required>
<button type="submit" class="btn-primary">Create Class</button>
</form>
<p class="hint">Created classes will appear in the student Class panel.</p>
</div>
</template>

<template id="tpl-courses">
<div class="page teacher-page">
<header class="page-header">
<button class="btn-back" onclick="render('dashboard')">Back</button>
<h1>Create Courses</h1>
<p class="section-desc">Upload videos and PDFs for paid CBSE courses</p>
</header>
<form id="makeCourseForm" class="form-card">
<label class="field-label">Course Name</label>
<input type="text" class="field-input" placeholder="Course name" required>
<label class="field-label">Class</label>
<select class="field-select" required>
<option value="">Select Class</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>
<label class="field-label">Subject</label>
<select class="field-select" required>
<option value="">Select Subject</option>
<option value="physics">Physics</option>
<option value="maths">Mathematics</option>
<option value="chemistry">Chemistry</option>
</select>
<label class="field-label">Price (INR)</label>
<input type="number" class="field-input" placeholder="Enter price" min="0" required>
<label class="field-label">Cover Image</label>
<input type="file" class="field-file" accept="image/*">
<label class="field-label">Videos (select multiple)</label>
<input type="file" class="field-file" accept="video/*" multiple name="videos">
<label class="field-label">PDF File</label>
<input type="file" class="field-file" accept="application/pdf">
<button type="submit" class="btn-primary">Create Course</button>
</form>
<p class="hint">Cover image, videos, and PDF will be shown to students in the course panel.</p>
</div>
</template>

<template id="tpl-material">
<div class="page teacher-page">
<header class="page-header">
<button class="btn-back" onclick="render('dashboard')">Back</button>
<h1>Upload Study Material</h1>
<p class="section-desc">Upload PDFs that students can open directly on the site</p>
</header>
<form id="addMaterialForm" class="form-card">
<label class="field-label">Title</label>
<input type="text" class="field-input" placeholder="Material title" required>
<label class="field-label">Grade</label>
<select class="field-select" required>
<option value="">Select Grade</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>
<label class="field-label">Subject</label>
<select class="field-select" required>
<option value="">Select Subject</option>
<option value="physics">Physics</option>
<option value="maths">Mathematics</option>
<option value="chemistry">Chemistry</option>
</select>
<label class="field-label">PDF File</label>
<input type="file" class="field-file" accept="application/pdf" required>
<button type="submit" class="btn-primary">Upload Material</button>
</form>
<p class="hint">Uploaded PDFs will appear in the student Study Material panel and can be opened in-browser.</p>
</div>
</template>

<template id="tpl-tests">
<div class="page teacher-page">
<header class="page-header">
<button class="btn-back" onclick="render('dashboard')">Back</button>
<h1>Make Tests</h1>
<p class="section-desc">Create MCQ tests for students</p>
</header>
<form id="makeTestForm" class="form-card">
<label class="field-label">Test Name</label>
<input type="text" class="field-input" placeholder="Enter test name" required>
<label class="field-label">Class</label>
<select class="field-select" required>
<option value="">Select Class</option>
<option value="11">Class 11</option>
<option value="12">Class 12</option>
</select>
<label class="field-label">Subject</label>
<select class="field-select" required>
<option value="">Select Subject</option>
<option value="physics">Physics</option>
<option value="maths">Mathematics</option>
<option value="chemistry">Chemistry</option>
</select>
<label class="field-label">Time Limit (minutes)</label>
<input type="number" class="field-input" placeholder="5" min="1" value="5" required id="timeLimitInput">
<label class="field-label">Cover Image</label>
<input type="file" class="field-file" accept="image/*">
<div id="mcqContainer">
<div class="mcq-row">
<label class="field-label">Question 1</label>
<input type="text" class="field-input" placeholder="Enter MCQ question" required>
<div class="options">
<div class="option-item"><input type="radio" name="q1" checked><input type="text" class="field-input" placeholder="Option A" style="flex:1;" value="Option A"></div>
<div class="option-item"><input type="radio" name="q1"><input type="text" class="field-input" placeholder="Option B" style="flex:1;" value="Option B"></div>
<div class="option-item"><input type="radio" name="q1"><input type="text" class="field-input" placeholder="Option C" style="flex:1;" value="Option C"></div>
<div class="option-item"><input type="radio" name="q1"><input type="text" class="field-input" placeholder="Option D" style="flex:1;" value="Option D"></div>
</div>
<button type="button" class="remove-btn" onclick="removeMCQ(this)">Remove</button>
</div>
</div>
<button type="button" class="btn-outline" style="width: fit-content; margin-bottom: 16px;" onclick="addMCQ()">Add Question</button>
<button type="submit" class="btn-primary">Create Test</button>
</form>
<p class="hint">Tests created here will appear in the student Tests panel.</p>
</div>
</template>

<template id="tpl-manage">
<div class="page teacher-page">
<header class="page-header">
<button class="btn-back" onclick="render('dashboard')">Back</button>
<h1>Manage Content</h1>
<p class="section-desc">Delete classes, courses, materials, and tests</p>
</header>
<h2 class="section-title">Classes</h2>
<div id="manageClasses" class="manage-list"></div>
<h2 class="section-title">Courses</h2>
<div id="manageCourses" class="manage-list"></div>
<h2 class="section-title">Study Materials</h2>
<div id="manageMaterials" class="manage-list"></div>
<h2 class="section-title">Tests</h2>
<div id="manageTests" class="manage-list"></div>
</div>
</template>

<script>
function checkCode() {
const code = document.getElementById("gateCode").value;
if (code === "MOTABOY") {
document.getElementById("loginGate").style.display = "none";
document.getElementById("appShell").style.display = "block";
document.getElementById("gateError").textContent = "";
} else {
document.getElementById("gateError").textContent = "Invalid security code";
document.getElementById("gateCode").value = "";
}
}

(function initThemeToggle() {
const btn = document.getElementById("themeToggle");
if (!btn) return;
const isDark = () => document.documentElement.getAttribute("data-theme") === "dark";
btn.setAttribute("aria-pressed", String(isDark()));
btn.addEventListener("click", () => {
const next = isDark() ? "light" : "dark";
document.documentElement.setAttribute("data-theme", next);
btn.setAttribute("aria-pressed", String(next === "dark"));
try { localStorage.setItem("mc-theme", next); } catch (e) {}
});
})();

const API = '/api';
let mcqCount = 1;

function addMCQ() {
mcqCount++;
const container = document.getElementById("mcqContainer");
const row = document.createElement("div");
row.className = "mcq-row";
row.innerHTML = `
<label class="field-label">Question ${mcqCount}</label>
<input type="text" class="field-input" placeholder="Enter MCQ question" required>
<div class="options">
<div class="option-item"><input type="radio" name="q${mcqCount}" checked><input type="text" class="field-input" placeholder="Option A" style="flex:1;" value="Option A"></div>
<div class="option-item"><input type="radio" name="q${mcqCount}"><input type="text" class="field-input" placeholder="Option B" style="flex:1;" value="Option B"></div>
<div class="option-item"><input type="radio" name="q${mcqCount}"><input type="text" class="field-input" placeholder="Option C" style="flex:1;" value="Option C"></div>
<div class="option-item"><input type="radio" name="q${mcqCount}"><input type="text" class="field-input" placeholder="Option D" style="flex:1;" value="Option D"></div>
</div>
<button type="button" class="remove-btn" onclick="removeMCQ(this)">Remove</button>
`;
container.appendChild(row);
}

function removeMCQ(btn) {
if (mcqCount > 1) {
btn.closest(".mcq-row").remove();
mcqCount--;
document.querySelectorAll(".mcq-row").forEach((r, i) => {
r.querySelector(".field-label").textContent = "Question " + (i + 1);
const name = "q" + (i + 1);
r.querySelectorAll('input[type="radio"]').forEach(rb => rb.name = name);
});
}
}

const templates = {
dashboard: document.getElementById("tpl-dashboard").content,
classes: document.getElementById("tpl-classes").content,
courses: document.getElementById("tpl-courses").content,
material: document.getElementById("tpl-material").content,
tests: document.getElementById("tpl-tests").content,
manage: document.getElementById("tpl-manage").content
};

const app = document.getElementById("app");

function render(templateId) {
const tpl = templates[templateId];
if (!tpl) return;
const clone = tpl.cloneNode(true);
app.innerHTML = "";
app.appendChild(clone);
attachFormHandlers(templateId);
if (templateId === "manage") loadManage();
}

function attachFormHandlers(templateId) {
if (templateId === "classes") {
document.getElementById("makeClassForm")?.addEventListener("submit", async (e) => {
e.preventDefault();
const form = e.target;
const selects = form.querySelectorAll('select');
const texts = form.querySelectorAll('input[type="text"]');
const data = { name: texts[0].value, grade: selects[0].value, subject: selects[1].value, meetLink: texts[1].value };
try {
await fetch(API + '/classes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
alert("Class created successfully!");
form.reset();
} catch (err) { alert("Error: " + err.message); }
});
}
if (templateId === "courses") {
document.getElementById("makeCourseForm")?.addEventListener("submit", async (e) => {
e.preventDefault();
const form = e.target;
const formData = new FormData();
const texts = form.querySelectorAll('input[type="text"]');
const selects = form.querySelectorAll('select');
formData.append('name', texts[0].value);
formData.append('classLevel', selects[0].value);
formData.append('subject', selects[1].value);
formData.append('price', form.querySelector('input[type="number"]').value);
const files = form.querySelectorAll('input[type="file"]');
if (files[0].files[0]) formData.append('coverImage', files[0].files[0]);
const videoInput = form.querySelector('input[name="videos"]');
if (videoInput) { for (let i = 0; i < videoInput.files.length; i++) formData.append('videos', videoInput.files[i]); }
if (files[files.length-1].files[0]) formData.append('pdfFile', files[files.length-1].files[0]);
try {
await fetch(API + '/courses', { method: 'POST', body: formData });
alert("Course created successfully!");
form.reset();
} catch (err) { alert("Error: " + err.message); }
});
}
if (templateId === "material") {
document.getElementById("addMaterialForm")?.addEventListener("submit", async (e) => {
e.preventDefault();
const form = e.target;
const formData = new FormData();
formData.append('title', form.querySelector('input[type="text"]').value);
const selects = form.querySelectorAll('select');
formData.append('grade', selects[0].value);
formData.append('subject', selects[1].value);
formData.append('pdfFile', form.querySelector('input[type="file"]').files[0]);
try {
await fetch(API + '/materials', { method: 'POST', body: formData });
alert("Material uploaded successfully!");
form.reset();
} catch (err) { alert("Error: " + err.message); }
});
}
if (templateId === "tests") {
document.getElementById("makeTestForm")?.addEventListener("submit", async (e) => {
e.preventDefault();
const form = e.target;
const questions = [];
document.querySelectorAll(".mcq-row").forEach((row) => {
const qText = row.querySelector('input[type="text"]').value;
const opts = Array.from(row.querySelectorAll('.option-item input[type="text"]')).map(i => i.value);
const correctIdx = Array.from(row.querySelectorAll('input[type="radio"]')).findIndex(r => r.checked);
questions.push({ question: qText, options: opts, correct: correctIdx });
});
const formData = new FormData();
formData.append('name', form.querySelector('input[type="text"]').value);
const selects = form.querySelectorAll('select');
formData.append('classLevel', selects[0].value);
formData.append('subject', selects[1].value);
formData.append('timeLimit', (parseInt(form.querySelector('#timeLimitInput').value) || 5) * 60);
formData.append('questions', JSON.stringify(questions));
const coverInput = form.querySelector('input[type="file"]');
if (coverInput && coverInput.files[0]) formData.append('coverImage', coverInput.files[0]);
try {
await fetch(API + '/tests', { method: 'POST', body: formData });
alert("Test created successfully!");
form.reset();
mcqCount = 1;
} catch (err) { alert("Error: " + err.message); }
});
}
}

async function loadManage() {
async function loadSection(endpoint, containerId, nameField) {
const res = await fetch(API + endpoint);
const items = await res.json();
const container = document.getElementById(containerId);
if (!container) return;
if (items.length === 0) { container.innerHTML = '<p class="hint">None yet.</p>'; return; }
container.innerHTML = items.map(item => `
<div class="manage-item">
<span>${item[nameField] || item.title || item.name}</span>
<button class="remove-btn" onclick="deleteItem('${endpoint}', ${item.id})">Delete</button>
</div>
`).join('');
}
await loadSection('/classes', 'manageClasses', 'name');
await loadSection('/courses', 'manageCourses', 'name');
await loadSection('/materials', 'manageMaterials', 'title');
await loadSection('/tests', 'manageTests', 'name');
}

async function deleteItem(endpoint, id) {
if (!confirm('Delete this item?')) return;
try {
await fetch(API + endpoint + '/' + id, { method: 'DELETE' });
loadManage();
loadBrowse();
} catch (err) { alert('Error: ' + err.message); }
}

async function loadBrowse() {
try {
const classes = await (await fetch(API + '/classes')).json();
const courses = await (await fetch(API + '/courses')).json();
const materials = await (await fetch(API + '/materials')).json();
const tests = await (await fetch(API + '/tests')).json();

const cEl = document.getElementById("browseClasses");
if (cEl) cEl.innerHTML = classes.length ? classes.map(c => `<div class="card"><h3 class="card-title">${c.name}</h3><p class="card-sub">${c.subject} &bull; Class ${c.grade}</p><button class="btn-outline meet-btn" onclick="window.open('${c.meetLink}','_blank')">Join</button><button class="remove-btn" style="margin-top:8px;width:100%;" onclick="deleteItem('/classes', ${c.id})">Delete</button></div>`).join('') : '<p class="hint">None yet.</p>';

const coEl = document.getElementById("browseCourses");
if (coEl) coEl.innerHTML = courses.length ? courses.map(c => `<div class="card"><h3 class="card-title">${c.name}</h3><p class="card-sub">${c.subject} &bull; Class ${c.classLevel} &bull; Rs.${c.price || 0}</p><button class="remove-btn" style="margin-top:8px;width:100%;" onclick="deleteItem('/courses', ${c.id})">Delete</button></div>`).join('') : '<p class="hint">None yet.</p>';

const mEl = document.getElementById("browseMaterials");
if (mEl) mEl.innerHTML = materials.length ? materials.map(m => `<div class="card"><h3 class="card-title">${m.title}</h3><p class="card-sub">Class ${m.grade} &bull; ${m.subject}</p>${m.pdfFile ? '<a href="' + encodeURI(m.pdfFile) + '" target="_blank" class="btn-outline">View PDF</a>' : ''}<button class="remove-btn" style="margin-top:8px;width:100%;" onclick="deleteItem('/materials', ${m.id})">Delete</button></div>`).join('') : '<p class="hint">None yet.</p>';

const tEl = document.getElementById("browseTests");
if (tEl) tEl.innerHTML = tests.length ? tests.map(t => `<div class="card"><h3 class="card-title">${t.name}</h3><p class="card-sub">Class ${t.classLevel} &bull; ${t.subject} &bull; ${t.questions ? t.questions.length : 0} MCQs</p><button class="remove-btn" style="margin-top:8px;width:100%;" onclick="deleteItem('/tests', ${t.id})">Delete</button></div>`).join('') : '<p class="hint">None yet.</p>';
} catch (err) { console.error(err); }
}

document.querySelector(".sidebar-nav").addEventListener("click", (e) => {
const btn = e.target.closest(".sidebar-item");
if (!btn) return;
document.querySelectorAll(".sidebar-item").forEach(b => b.classList.remove("active"));
btn.classList.add("active");
render(btn.dataset.section);
});

render("dashboard");
</script>
</body>
</html>
