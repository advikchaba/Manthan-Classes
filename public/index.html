<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manthan Classes</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('mc-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<meta name="theme-color" content="#f2f3ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="js/beams.css">

</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="brand-mark" aria-hidden="true">M</span>
    <span class="nav-brand">Manthan Classes</span>
  </div>
  <div class="nav-actions">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
    <button class="nav-btn-icon" onclick="window.location.href='teacher/index.html'">Admin</button>
  </div>
</nav>

<div class="app-shell">
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-eyebrow">Student</span>
  </div>
  <nav class="sidebar-nav">
    <button class="sidebar-item active" data-section="dashboard">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.4 12 3.5l8.5 6.9"/><path d="M5.8 9.6V20h12.4V9.6"/><path d="M10 20v-5.2h4V20"/></svg>
      <span class="item-label">Home</span>
    </button>
    <button class="sidebar-item" data-section="courses">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5V5.5Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/><path d="M8 7.5h8"/></svg>
      <span class="item-label">Courses</span>
    </button>
    <button class="sidebar-item" data-section="classes">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="12.5" height="13" rx="2.5"/><path d="m15.5 10.5 5.5-3v9l-5.5-3"/></svg>
      <span class="item-label">Live class</span>
    </button>
    <button class="sidebar-item" data-section="material">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5L13.5 3Z"/><path d="M13.5 3v5.5H19"/><path d="M8.5 13.5h7M8.5 17h4.5"/></svg>
      <span class="item-label">Study material</span>
    </button>
    <button class="sidebar-item" data-section="tests">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6v2.2H9z"/><path d="M9 5.6H7.2a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h9.6a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2H15"/><path d="m8.8 13.6 2 2 4.4-4.4"/></svg>
      <span class="item-label">Tests</span>
    </button>
  </nav>
</aside>

<main class="content" id="app"></main>
</div>

<template id="tpl-dashboard">
<div class="page student-page">
  <header class="page-head hero">
    <div class="hero-beams" aria-hidden="true"><div id="heroBeams"></div></div>
    <div class="hero-copy">
      <p class="page-date" id="todayLabel"></p>
      <h1>Welcome back</h1>
      <p class="page-sub">Live sessions, recorded lectures, notes and timed tests for CBSE Class 11 and 12.</p>
    </div>
  </header>

  <div id="nowSlot"></div>

  <section class="block">
    <header class="block-head">
      <h2 class="block-title">Courses<span class="block-count" id="courseCount"></span></h2>
      <button class="text-link" onclick="render('courses')">View all</button>
    </header>
    <div class="list" id="courseList"></div>
  </section>

  <section class="block">
    <header class="block-head">
      <h2 class="block-title">Practice tests<span class="block-count" id="testCount"></span></h2>
      <button class="text-link" onclick="render('tests')">All tests</button>
    </header>
    <div class="list" id="testList"></div>
  </section>

  <section class="block">
    <header class="block-head">
      <h2 class="block-title">Notes and material<span class="block-count" id="materialCount"></span></h2>
      <button class="text-link" onclick="render('material')">View all</button>
    </header>
    <div class="list" id="materialList"></div>
  </section>
</div>
</template>

<template id="tpl-courses">
<div class="page student-page">
  <header class="page-head">
    <button class="btn-back" onclick="render('dashboard')">Home</button>
    <h1>Courses</h1>
    <p class="page-sub">Recorded lectures and notes for CBSE Class 11 and 12.</p>
  </header>
  <div class="list" id="courseGrid"></div>
</div>
</template>

<template id="tpl-classes">
<div class="page student-page">
  <header class="page-head">
    <button class="btn-back" onclick="render('dashboard')">Home</button>
    <h1>Live classes</h1>
    <p class="page-sub">Join a session with your teacher on Google Meet.</p>
  </header>
  <div class="list" id="classGrid"></div>
</div>
</template>

<template id="tpl-material">
<div class="page student-page">
  <header class="page-head">
    <button class="btn-back" onclick="render('dashboard')">Home</button>
    <h1>Study material</h1>
    <p class="page-sub">Notes, formula sheets and question banks.</p>
  </header>
  <div class="filter-bar">
    <div class="filter-group">
      <label class="field-label" for="filterGrade">Grade</label>
      <select id="filterGrade" class="field-select">
        <option value="">All grades</option>
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="field-label" for="filterSubject">Subject</label>
      <select id="filterSubject" class="field-select">
        <option value="">All subjects</option>
        <option value="physics">Physics</option>
        <option value="maths">Mathematics</option>
        <option value="chemistry">Chemistry</option>
        <option value="biology">Biology</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="field-label" for="searchMaterial">Search</label>
      <input type="text" id="searchMaterial" class="field-input" placeholder="Search material">
    </div>
  </div>
  <div class="list" id="materialGrid"></div>
</div>
</template>

<template id="tpl-tests">
<div class="page student-page">
  <header class="page-head">
    <button class="btn-back" onclick="render('dashboard')">Home</button>
    <h1>Practice tests</h1>
    <p class="page-sub">Timed MCQ sets, scored as soon as you submit.</p>
  </header>
  <div class="list" id="testGrid"></div>
</div>
</template>

<script src="js/beams.js"></script>
<script src="app.js"></script>
</body>
</html>
